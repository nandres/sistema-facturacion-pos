<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*;" />
    <title>Sistema de Facturación</title>
    <style>
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
        50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      }
      @keyframes pulse-glow-red {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
        50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      }
      @keyframes dot-grid {
        0% { background-position: 0 0; }
        100% { background-position: 24px 24px; }
      }
      .anim-glow { animation: pulse-glow 2s ease-in-out infinite; }
      .anim-glow-red { animation: pulse-glow-red 2s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
